name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      full_e2e:
        description: 运行完整桌面 E2E 与证据回归
        type: boolean
        default: false
      package_smoke:
        description: 同时验证未签名 macOS 应用包
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  desktop:
    name: Desktop macOS ARM64
    needs: quality
    runs-on: macos-26
    timeout-minutes: ${{ inputs.package_smoke && 135 || 75 }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      FULL_E2E: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.full_e2e || inputs.package_smoke)) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Require Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.4"
          cache-dependency-path: packages/provider-runtime/runner/go.sum
      - name: Fingerprint media toolchain
        id: toolchain
        run: |
          fingerprint=$({ sw_vers; xcodebuild -version; xcrun clang --version; } | shasum -a 256 | cut -d ' ' -f 1)
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .cache/media
          key: media-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('resources/media/build.json', 'scripts/build-media.mjs') }}
      - run: pnpm install --frozen-lockfile
      - name: Build desktop app
        id: build
        run: node scripts/check.mjs desktop build
      - name: Integration tests
        id: integration
        run: node scripts/check.mjs desktop integration
      - name: Agent upstream regression
        id: upstream
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/check.mjs desktop upstream
      - name: Electron E2E
        id: e2e
        if: ${{ !cancelled() && steps.build.outcome == 'success' && env.FULL_E2E == 'true' }}
        run: node scripts/check.mjs desktop e2e
      - name: Build unsigned macOS package
        id: package
        if: ${{ !cancelled() && inputs.package_smoke && env.FULL_E2E == 'true' && steps.build.outcome == 'success' }}
        run: node scripts/check.mjs desktop package
      - name: Packaged Electron E2E
        id: packaged_e2e
        if: ${{ !cancelled() && steps.package.outcome == 'success' && env.FULL_E2E == 'true' }}
        run: node scripts/check.mjs desktop packaged-e2e
      - name: Upload test evidence
        id: evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: desktop-test-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Desktop verification summary
        if: always()
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CHECK_STEPS: ${{ toJSON(steps) }}
          PACKAGE_SMOKE: ${{ inputs.package_smoke }}
          FULL_E2E: ${{ env.FULL_E2E }}
          EVIDENCE_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: node scripts/desktop-summary.mjs
