name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      package_smoke:
        description: 同时验证未签名 macOS 应用包
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  desktop:
    name: Desktop macOS ARM64
    needs: quality
    runs-on: macos-26
    timeout-minutes: ${{ inputs.package_smoke && 135 || 75 }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.4"
          cache-dependency-path: packages/provider-runtime/runner/go.sum
      - name: Fingerprint media toolchain
        id: toolchain
        run: |
          fingerprint=$({ sw_vers; xcodebuild -version; xcrun clang --version; } | shasum -a 256 | cut -d ' ' -f 1)
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/media
          key: media-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('resources/media/build.json', 'scripts/build-media.mjs') }}
      - run: pnpm install --frozen-lockfile
      - name: Build desktop app
        id: build
        run: node scripts/check.mjs desktop build
      - name: Integration tests
        id: integration
        run: node scripts/check.mjs desktop integration
      - name: Agent upstream regression
        id: upstream
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/check.mjs desktop upstream
      - name: Electron E2E
        id: e2e
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/check.mjs desktop e2e
      - name: Build unsigned macOS package
        id: package
        if: ${{ !cancelled() && inputs.package_smoke && steps.build.outcome == 'success' }}
        run: node scripts/check.mjs desktop package
      - name: Packaged Electron E2E
        id: packaged_e2e
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: node scripts/check.mjs desktop packaged-e2e
      - name: Upload test evidence
        id: evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-test-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Desktop verification summary
        if: always()
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CHECK_STEPS: ${{ toJSON(steps) }}
          PACKAGE_SMOKE: ${{ inputs.package_smoke }}
          EVIDENCE_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: node scripts/desktop-summary.mjs
