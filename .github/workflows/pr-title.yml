name: PR Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: PR Title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate Conventional Commits title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node --input-type=module <<'NODE'
          const title = process.env.PR_TITLE ?? '';
          const pattern = /^(feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert)(\([a-z0-9][a-z0-9/-]*\))?!?: [^\s\r\n][^\r\n]*$/u;
          if (!pattern.test(title)) {
            console.error('PR 标题须符合 Conventional Commits，例如：feat(canvas): 支持节点分组');
            process.exitCode = 1;
          } else {
            console.log('PR 标题格式检查通过');
          }
          NODE
